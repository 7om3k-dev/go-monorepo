<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="language" content="english" />
    <meta name=”title” content="Sign up" />
    <meta name="description" content="Sign up page"/>
    <meta name="googlebot" content=”notranslate” />
    <meta name="revised" content="Monday, September 14th, 2026" />
    <meta name="author" content="github.com/7om3k" />
    <meta http-equiv="content-type" content="text/html">
    <!--  <meta http-equiv="refresh" content="300"/>-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
</head>
<body>
<h1>
    Sign up
</h1>
<form method="post">
    <p>
        <label for="user-first-name">First name:</label>
        <input type="text" id="user-first-name" name="user_first_name" required>
    </p>
    <p>
        <label for="user-last-name">Last name:</label>
        <input type="text" id="user-last-name" name="user_last_name" required>
    </p>
    <p>
        <label for="user-email">Email:</label>
        <input type="text" id="user-email" name="user_email" required>
    </p>
    <p>
        <label for="user-password">Password:</label>
        <input type="password" id="user-password" name="user_password" required>
    </p>
    <p>
        <label for="user-confirm-password">Confirm password:</label>
        <input type="password" id="user-confirm-password" name="user_confirm_password" required>
    </p>
    <button type="submit">Submit</button>

    <style>
        input:focus:invalid {
            border-color: red;
        }
    </style>
</form>
</body>
</html>
